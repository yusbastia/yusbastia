# Eggdrop configuration file for SecureBot
# Save as securebot.conf and adjust the settings below

# Basic bot settings
set nick "SecureBot"                  # Bot's primary nickname
set altnick "SecureBot2"               # Alternate nickname
set username "securebot"               # Ident (username)
set realname "SecureBot v2.0"          # Realname
set admin "Lemon <Lemon@email.com>"  # Admin contact

# Network settings
set server "irc.dal.net"               # IRC server
set port 6667                          # Server port
set my-ip ""                           # Optional: bind to specific IP
set my-hostname ""                      # Optional: vhost

# Userfile and channel file
set userfile "securebot.user"           # File to store users
set chanfile "securebot.chan"           # File to store channels

# Script directory
set script-path "scripts/"
source scripts/alltools.tcl             # Optional: useful utilities

# Load required modules (if not compiled in)
# Uncomment if you need to load modules dynamically
# loadmodule channels
# loadmodule server
# loadmodule ctcp
# loadmodule irc
# loadmodule console

# Basic bot modes
set keep-nick 1                         # Keep trying to get primary nick
set strict-host 0                        # Don't strip hostmasks
set quiet-save 0                          # Be verbose when saving

# Flood protection (built-in)
set flood-chan 5:60                       # Max 5 lines in 60 seconds
set flood-ctcp 3:60                        # Max 3 CTCP in 60 seconds
set flood-join 5:60                        # Max 5 joins in 60 seconds
set flood-kick 3:60                        # Max 3 kicks in 60 seconds
set flood-deop 3:60                        # Max 3 deops in 60 seconds
set flood-nick 5:60                        # Max 5 nick changes in 60 seconds

set need-op { putserv "PRIVMSG chanserv :op $chan $botnick" }
set need-invite { putserv "PRIVMSG chanserv :invite $chan $botnick" }
set need-key { putserv "PRIVMSG chanserv :invite $chan $botnick" }
set need-unban { putserv "PRIVMSG chanserv :unban $chan $botnick" }
set need-limit { putserv "PRIVMSG chanserv :invite $chan $botnick" }

# CTCP replies
set ctcp-version "SecureBot v2.0 - https://github.com/your/repo"
set ctcp-finger "I'm a bot."
set ctcp-userinfo "I'm a bot."

# Owner and user flags
set owner "YourNick"                      # Change to your nickname
set admin "YourNick"                       # Same as owner for simplicity

# Channels to join initially
chan add "#yourchannel" {
    chanmode "+nt"
    idle-kick 0
    stopnethack-mode 0
    revenge-mode 0
    ban-time 120
    exempt-time 60
    invite-time 60
    need-op { putserv "PRIVMSG chanserv :op $chan $botnick" }
    need-invite { putserv "PRIVMSG chanserv :invite $chan $botnick" }
    need-key { putserv "PRIVMSG chanserv :invite $chan $botnick" }
    need-unban { putserv "PRIVMSG chanserv :unban $chan $botnick" }
    need-limit { putserv "PRIVMSG chanserv :invite $chan $botnick" }
    flood-chan 5:60
    flood-ctcp 3:60
    flood-join 5:60
    flood-kick 3:60
    flood-deop 3:60
    flood-nick 5:60
}

# Load SecureBot script
source scripts/securebot.tcl

# Additional scripts (optional)
# source scripts/weather.tcl
# source scripts/calc.tcl

# Console and log settings
set console "mkcopsx"                      # Console modes
logfile mco * "logs/securebot.log"          # Main log
logfile jpk #yourchannel "logs/securebot.chan.log"

# PID file
set pidfile "pid.securebot"

# Die on fatal error?
set die-on-save 1

# End of configuration
putlog "SecureBot configuration loaded."
